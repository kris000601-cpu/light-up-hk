<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>照片定位測試（內部）</title>
<!--
  內部測試頁（2026-11-24）：iPhone 用網頁選照片時，照片裏的位置（GPS）還在不在？
  決定「從相簿照片導入以前去過的地方」做不做得成。照片只在這部手機裏讀，不會上傳。
-->
<style>
  body { margin: 0; padding: 20px 16px 40px; background: #f3eddf; color: #1e2b3c; font: 15px/1.6 'Noto Sans TC', 'PingFang HK', sans-serif; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0 0 12px; }
  .small { font-size: 13px; color: #5c667a; }
  label.btn { display: block; text-align: center; padding: 14px; margin: 16px 0; border-radius: 12px; background: #2d3e5c; color: #fbf8f0; font-weight: 700; }
  input { display: none; }
  .sum { padding: 12px; border-radius: 10px; background: #fbf8f0; border: 1px solid #c1c1be; margin: 12px 0; }
  .row { padding: 10px 0; border-bottom: 1px solid #c1c1be; font-size: 13px; }
  .row b { font-size: 14px; }
  .yes { color: #1e2b3c; }
  .no { color: #b9473a; font-weight: 700; }
  ol { padding-left: 20px; margin: 0 0 12px; }
</style>
</head>
<body>
<h1>照片定位測試</h1>
<p>看看網頁從 iPhone 選照片時，還讀不讀到照片拍攝的位置。<b>照片只在這部手機裏讀，不會上傳。</b></p>
<ol class="small">
  <li>按下面的按鈕，選「<b>照片圖庫</b>」，揀 3–5 張你肯定是在外面拍的相（例如去行山、去旅行時拍的）。</li>
  <li>看結果，截圖給 Claude。</li>
  <li>再按一次，這次選「<b>選擇檔案</b>」→ 進「照片」，揀同樣幾張，再截圖。</li>
</ol>
<label class="btn">選照片<input id="pick" type="file" accept="image/*" multiple></label>
<div id="out"></div>
<script src="data.js"></script>
<script>
// 讀照片裏的 EXIF：拍攝時間、GPS。JPEG 和 HEIC 都是在檔案裏找「Exif\0\0」，後面接 TIFF 結構。
function readExif(buf) {
  const u8 = new Uint8Array(buf)
  let at = -1
  for (let i = 0; i < u8.length - 6; i++) {
    if (u8[i] === 0x45 && u8[i + 1] === 0x78 && u8[i + 2] === 0x69 && u8[i + 3] === 0x66 && u8[i + 4] === 0 && u8[i + 5] === 0) { at = i + 6; break }
  }
  if (at < 0) return { exif: false }
  const dv = new DataView(buf, at)
  const le = dv.getUint16(0) === 0x4949
  const u16 = (o) => dv.getUint16(o, le), u32 = (o) => dv.getUint32(o, le)
  const ifd = (off) => {
    const n = u16(off), tags = {}
    for (let i = 0; i < n; i++) {
      const e = off + 2 + i * 12
      tags[u16(e)] = { type: u16(e + 2), count: u32(e + 4), val: e + 8 }
    }
    return tags
  }
  const rat = (o) => u32(o) / u32(o + 4)
  const str = (t) => { const o = t.count > 4 ? u32(t.val) : t.val; let s = ''; for (let i = 0; i < t.count - 1; i++) s += String.fromCharCode(dv.getUint8(o + i)); return s }
  const ifd0 = ifd(u32(4))
  const res = { exif: true }
  if (ifd0[0x8769]) { const ex = ifd(u32(ifd0[0x8769].val)); if (ex[0x9003]) res.date = str(ex[0x9003]) }
  if (ifd0[0x8825]) {
    const g = ifd(u32(ifd0[0x8825].val))
    if (g[2] && g[4]) {
      const dms = (t) => { const o = u32(t.val); return rat(o) + rat(o + 8) / 60 + rat(o + 16) / 3600 }
      let lat = dms(g[2]), lng = dms(g[4])
      if (g[1] && str(g[1]) === 'S') lat = -lat
      if (g[3] && str(g[3]) === 'W') lng = -lng
      res.lat = lat; res.lng = lng
    }
  }
  return res
}
const near = (lat, lng) => {
  const kx = Math.cos(lat * Math.PI / 180) * 111320
  let best = null, bd = Infinity
  for (const s of window.SPOTS || []) { const d = Math.hypot((s.lng - lng) * kx, (s.lat - lat) * 110574); if (d < bd) { bd = d; best = s } }
  return best ? { s: best, d: Math.round(bd) } : null
}
document.getElementById('pick').addEventListener('change', async (e) => {
  const files = [...e.target.files]
  const out = document.getElementById('out')
  out.innerHTML = '讀取中…'
  const rows = []
  let withGps = 0
  for (const f of files) {
    let r
    try { r = readExif(await f.arrayBuffer()) } catch (err) { r = { exif: false, err: String(err) } }
    if (r.lat !== undefined) withGps++
    const n = r.lat !== undefined ? near(r.lat, r.lng) : null
    rows.push(`<div class="row"><b>${f.name}</b>　${f.type || '?'}　${(f.size / 1024).toFixed(0)} KB<br>` +
      (r.date ? `拍攝時間：${r.date}<br>` : '拍攝時間：讀不到<br>') +
      (r.lat !== undefined
        ? `<span class="yes">有位置：${r.lat.toFixed(5)}, ${r.lng.toFixed(5)}${n ? `（最近的景點：${n.s.name}，約 ${n.d >= 1000 ? (n.d / 1000).toFixed(1) + ' 公里' : n.d + ' 米'}）` : ''}</span>`
        : `<span class="no">沒有位置${r.exif ? '（有其他資料，但位置被去掉了）' : '（照片裏甚麼資料都沒有）'}</span>`) + '</div>')
  }
  out.innerHTML = `<div class="sum">選了 ${files.length} 張，<b>${withGps} 張讀到位置</b>。</div>` + rows.join('')
  e.target.value = ''
})
</script>
</body>
</html>
