<html lang="zh-Hans">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>选中样式对比</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@900&display=swap" />
<style>
  :root {
    --paper: #f3eddf; --card: #fbf8f0; --navy: #2d3e5c; --ink: #1e2b3c; --sub: #5c667a; --hair: #c1c1be; --seal: #b9473a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Noto Sans TC', sans-serif; padding: 20px 16px 40px; }
  h1 { font-family: 'Noto Serif TC', serif; font-weight: 900; font-size: 22px; margin: 0 0 4px; }
  .lead { color: var(--sub); font-size: 13px; margin: 0 0 14px; line-height: 1.6; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px 18px; margin-bottom: 16px; font-size: 13px; }
  .seg { display: inline-flex; border: 1px solid var(--hair); border-radius: 16px; overflow: hidden; background: var(--card); }
  .seg button { border: 0; background: none; font: inherit; padding: 6px 12px; color: var(--sub); cursor: pointer; }
  .seg button.on { background: var(--navy); color: var(--card); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 18px; max-width: 1100px; }
  .opt h2 { font-size: 15px; margin: 0 0 2px; display: flex; align-items: center; gap: 8px; }
  .opt h2 small { font-weight: 400; color: var(--sub); font-size: 12px; }
  .opt p { margin: 0 0 8px; font-size: 12px; color: var(--sub); line-height: 1.5; }
  .badge { font-size: 11px; font-weight: 500; color: var(--seal); border: 1px solid var(--seal); border-radius: 4px; padding: 0 5px; }
  .map { position: relative; aspect-ratio: 1000 / 733; }
  .map svg { display: block; width: 100%; height: 100%; overflow: hidden; }
  .fade .map svg {
    -webkit-mask-image: linear-gradient(to right, transparent, #000 18px, #000 calc(100% - 18px), transparent), linear-gradient(to bottom, transparent, #000 18px, #000 calc(100% - 18px), transparent);
    -webkit-mask-composite: source-in;
    mask-image: linear-gradient(to right, transparent, #000 18px, #000 calc(100% - 18px), transparent), linear-gradient(to bottom, transparent, #000 18px, #000 calc(100% - 18px), transparent);
    mask-composite: intersect;
  }
  .full.fade .map svg { -webkit-mask-image: none; mask-image: none; }
  .d { stroke: var(--navy); stroke-width: 0.7px; stroke-linejoin: round; vector-effect: non-scaling-stroke; cursor: pointer; transition: opacity .2s; }
  .sel { fill: none; stroke-linejoin: round; vector-effect: non-scaling-stroke; pointer-events: none; }
  .tag { position: absolute; transform: translate(-50%, calc(-100% - 9px)); background: var(--card); border: 1.5px solid var(--ink); border-radius: 9px; padding: 4px 9px; font-family: 'Noto Serif TC', serif; font-weight: 900; font-size: 13px; white-space: nowrap; pointer-events: none; box-shadow: 0 2px 6px rgba(30,43,60,.12); }
  .tag::after { content: ''; position: absolute; left: 50%; bottom: -5px; width: 8px; height: 8px; background: var(--card); border-right: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink); transform: translateX(-50%) rotate(45deg); }
</style>
</head>

<h1>选中样式对比</h1>
<p class="lead">点任何一张图上的区，五张图会同时选中那个区。上面可以切换「放大 / 全图」和「边缘渐隐 / 直接裁切」。选好告诉我编号就行。</p>

      mk('path', { d: s.d, class: 'sel', stroke: '#1e2b3c', 'stroke-width': 2, 'clip-path': clip }, svg)
    }
    if (o.id === 4) {
      mk('path', { d: s.d, class: 'sel', stroke: '#1e2b3c', 'stroke-width': 2, 'clip-path': clip }, svg)
      mk('path', { d: s.d, fill: 'none', stroke: '#1e2b3c', 'stroke-width': 4.4 * k * 2 + 1.2 * k, 'clip-path': clip, 'pointer-events': 'none', mask: `url(#m${o.id})` }, svg)
      // 用遮罩挖出一條離邊 4.4px、寬 0.6px 的內線
      const mm = mk('mask', { id: 'm' + o.id, maskUnits: 'userSpaceOnUse', x: view.x, y: view.y, width: view.w, height: view.h }, defs)
      mk('rect', { x: view.x, y: view.y, width: view.w, height: view.h, fill: 'black' }, mm)
      mk('path', { d: s.d, fill: 'none', stroke: 'white', 'stroke-width': (4.4 + 0.6) * 2 * k }, mm)
      mk('path', { d: s.d, fill: 'none', stroke: 'black', 'stroke-width': 4.4 * 2 * k }, mm)
    }
    // 名字標籤
    box.querySelectorAll('.tag').forEach((t) => t.remove())
    const c = s.center
    const cx = ((c[0] - view.x) / view.w) * 100, cy = ((c[1] - view.y) / view.h) * 100
    if (cx >= 0 && cx <= 100 && cy >= 4 && cy <= 100) {
      const t = document.createElement('div'); t.className = 'tag'; t.textContent = s.name
      t.style.left = Math.min(84, Math.max(16, cx)) + '%'; t.style.top = cy + '%'; box.appendChild(t)
    }
  }
}
const centers = {}
// 用每區路徑的外框中心近似標籤位置
const tmp = document.createElementNS(NS, 'svg'); tmp.style.cssText = 'position:absolute;visibility:hidden'; document.body.appendChild(tmp)
for (const d of DATA) { const p = mk('path', { d: d.d }, tmp); const b = p.getBBox(); centers[d.code] = [b.x + b.width / 2, b.y + b.height / 2] }
tmp.remove()
function seg(id, fn) { const s = document.getElementById(id); s.addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; s.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); fn(b.dataset.v) }) }
seg('zoom', (v) => { zoomFull = v === 'full'; view = zoomFull ? { x: 0, y: 0, w: W, h: H } : IN; grid.classList.toggle('full', zoomFull); render() })
seg('edge', (v) => { grid.classList.toggle('fade', v === 'fade'); })
addEventListener('resize', render)
render()
</script>
