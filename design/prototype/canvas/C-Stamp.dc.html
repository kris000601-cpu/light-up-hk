<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { stamped: false };
}
thunk(delay, freq) {
setTimeout(function () {
try {
var C = window.AudioContext || window.webkitAudioContext;
var ctx = new C();
var n = Math.floor(ctx.sampleRate * 0.15);
var buf = ctx.createBuffer(1, n, ctx.sampleRate);
var d = buf.getChannelData(0);
for (var i = 0; i < n; i++) { d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 4); }
var src = ctx.createBufferSource();
src.buffer = buf;
var f = ctx.createBiquadFilter();
f.type = 'lowpass';
f.frequency.value = freq;
var g = ctx.createGain();
g.gain.value = 0.8;
src.connect(f); f.connect(g); g.connect(ctx.destination);
src.start();
} catch (e) {}
}, delay);
}
renderVals() {
var s = this.state.stamped;
return {
ready: !s,
stamped: s,
stageClass: s ? 'thud' : '',
stamp: () => { this.setState({ stamped: true }); this.thunk(220, 500); this.thunk(400, 800); },
reset: () => this.setState({ stamped: false })
};
}
}
</script>
