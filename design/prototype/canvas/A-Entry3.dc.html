body{margin:0}
a{color:#2D3E5C}a:hover{color:#1E2B3C}
.stage{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer;outline:none}
.stage:focus-visible{box-shadow:inset 0 0 0 2px #2D3E5C}
.stage.done{cursor:default;animation:thud .28s ease-out}
@keyframes thud{0%,100%{transform:none}30%{transform:translateY(3px)}}
@keyframes wet{from{opacity:1;filter:saturate(1.3) brightness(.9)}to{opacity:.95;filter:none}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rise{animation:rise .5s .45s ease both}
.full .hint{color:#B9473A;font-weight:700}

.tool{transform:translateY(-44px);transition:transform .25s ease-out}
.idle .tool{animation:float 2.6s ease-in-out infinite alternate}
@keyframes float{from{transform:translateY(-44px)}to{transform:translateY(-50px)}}
.press .tool{transform:none;transition:transform 900ms cubic-bezier(.4,0,.5,1)}
.full .tool{animation:quiver .1s linear infinite alternate}
.done .tool{animation:lift .55s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes quiver{from{transform:translateY(1px) rotate(-.35deg)}to{transform:translateY(1px) rotate(.35deg)}}
@keyframes lift{from{transform:translateY(1px);opacity:1}to{transform:translateY(-150px);opacity:0}}
.shadow{opacity:.14;transform:scale(1.1);transition:opacity .25s,transform .25s}
.press .shadow,.full .shadow{opacity:.85;transform:scale(.92);transition:opacity 900ms,transform 900ms}
.done .shadow{opacity:0;transition:opacity .3s}
.imprint{opacity:0}
.done .imprint{animation:wet 1.6s ease-out both}
.bar{transform:scaleX(0);transform-origin:left;transition:transform .2s}
.press .bar,.full .bar{transform:none;transition:transform 900ms linear}
@media (prefers-reduced-motion: reduce){*{animation-duration:1ms!important;transition-duration:1ms!important}}
</style>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { phase: 'idle' };
this.timer = null;
this.ph = 'idle';
}
componentWillUnmount() { clearTimeout(this.timer); }
noise(dur, freq, gain) {
try {
var C = window.AudioContext || window.webkitAudioContext;
if (!this.ctx) this.ctx = new C();
var ctx = this.ctx;
if (ctx.state === 'suspended') ctx.resume();
var n = Math.floor(ctx.sampleRate * dur);
var buf = ctx.createBuffer(1, n, ctx.sampleRate);
var d = buf.getChannelData(0);
for (var i = 0; i < n; i++) { d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3); }
var src = ctx.createBufferSource();
src.buffer = buf;
var f = ctx.createBiquadFilter();
f.type = 'lowpass';
f.frequency.value = freq;
var g = ctx.createGain();
g.gain.value = gain;
src.connect(f); f.connect(g); g.connect(ctx.destination);
src.start();
} catch (e) {}
}
buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
go(ph) { this.ph = ph; this.setState({ phase: ph }); }
start() {
if (this.ph !== 'idle') return;
this.noise(0.03, 700, 0.18);
this.go('press');
clearTimeout(this.timer);
this.timer = setTimeout(() => { this.go('full'); this.noise(0.022, 3400, 0.28); this.buzz(12); }, 900);
}
finish() {
var p = this.ph;
clearTimeout(this.timer);
if (p === 'full') { this.go('done'); this.noise(0.22, 400, 0.95); this.buzz(40); }
else if (p === 'press') { this.go('idle'); }
}
renderVals() {
var p = this.state.phase;
var hints = { idle: '按住印章，壓到底再放手', press: '繼續按住……', full: '放手！', done: '' };
return {
phase: p,
done: p === 'done',
notDone: p !== 'done',
showHint: p !== 'done',
hint: hints[p],
down: (e) => { try { if (e && e.currentTarget && e.currentTarget.setPointerCapture) e.currentTarget.setPointerCapture(e.pointerId); } catch (x) {} this.start(); },
up: () => this.finish(),
keyDown: (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (!e.repeat) this.start(); } },
keyUp: (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); this.finish(); } },
noMenu: (e) => e.preventDefault(),
reset: () => this.go('idle')
};
}
}
</script>
